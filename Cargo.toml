[workspace]
resolver = "2"
members = ["crates/core", "crates/collect", "crates/intel", "crates/cli"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
relay-core = { path = "crates/core" }
relay-collect = { path = "crates/collect" }
relay-intel = { path = "crates/intel" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
